<style>

<script>var DADOS={"materias":[{"id":"revista","grupo":"Revistas","tipo":"revista","destaque":true,"icone":"📖","curto":"Revista","titulo":"Cartola #13 — Tempo Rei","tag":"Revista · 38 páginas","cor":"bo","resumo":"A revista completa, para folhear página por página.","ficha":"João Pedro de Oliveira / Naila Sperotto / Nicole Reiser","capa":"arquivos/revista/capa-p.jpg","cw":700,"ch":989,"paginas":[],"textos":[],"info":{"sobre":["O editorial TEMPO REI foi desenvolvido como uma proposta de publicação na Cartola Magazine, considerando a linguagem visual da revista, seu público e a possibilidade de circulação das imagens em plataformas digitais. A escolha da publicação se deu pela afinidade entre sua estética, que valoriza imagens conceituais e narrativas visuais, e a proposta do editorial.","Como publicação independente, a Cartola Magazine dialoga com o público-alvo do projeto, formado por jovens adultos de 18 a 30 anos interessados em moda, arte, fotografia e cultura visual. A proposta é apresentada por meio de uma simulação de capa, que reúne os principais elementos visuais do editorial. Trata-se de uma proposta acadêmica: o editorial não foi aprovado nem publicado pela revista."],"processo":["A capa brinca com a escala. A modelo aparece gigante, equilibrando-se sobre o MASP em miniatura, como se a cidade e sua rotina coubessem sob seus pés. A inversão de proporção desloca o ponto de vista: nos cenários, a cidade se impõe sobre a personagem; na capa, é ela quem domina a paisagem. O equilíbrio precário retoma a tensão entre imposição e liberdade presente no conceito.","O cenário mostra o MASP e um trecho da Avenida Paulista em escala desproporcional à modelo, com uma cidade ao fundo que sobe em degradê até o preto, no lugar do céu. A atmosfera é lúdica e irônica. Por ser a capa, este cenário é uma exceção declarada ao roteiro geral: o fundo de cidade em degradê até o preto substitui o céu, e o vermelho do MASP se mantém como acento forte além das roupas."],"creditos":[["Direção criativa, fotografia e styling","João Pedro de Oliveira"],["Assistência de direção, fotografia e styling","Naila Sperotto"],["Modelo, beleza e cabelo","Nicole Reiser (@nicolereiser)"],["Locação","Estúdio fotográfico da Univali"],["Cenários","desenvolvidos com auxílio de inteligência artificial"],["Peças","look da coleção TEMPO REI e acervo pessoal"],["Pós-produção e fotocomposição","João Pedro de Oliveira"]]}},{"id":"temporei","grupo":"Editoriais","tipo":"editorial","destaque":true,"icone":"🎩","curto":"Editorial Tempo Rei","titulo":"Editorial Tempo Rei","tag":"Editorial · 5 páginas","resumo":"…até que a tensão encontre uma abertura, e o que estava escondido atravesse a superfície.","ficha":"Publicado na Cartola #13, págs. 30 a 34","capa":"arquivos/temporei/foto06-p.jpg","paginas":[{"src":"arquivos/temporei/pag01.jpg","w":1400,"h":1980},{"src":"arquivos/temporei/pag02.jpg","w":1400,"h":1980},{"src":"arquivos/temporei/pag03.jpg","w":1400,"h":1980},{"src":"arquivos/temporei/pag04.jpg","w":1400,"h":1980},{"src":"arquivos/temporei/pag05.jpg","w":1400,"h":1980}],"fotos":[{"p":"arquivos/temporei/foto01-p.jpg","g":"arquivos/temporei/foto01.jpg","w":600,"h":337,"leg":"Tempo Rei · foto 1"},{"p":"arquivos/temporei/foto02-p.jpg","g":"arquivos/temporei/foto02.jpg","w":600,"h":901,"leg":"Tempo Rei · foto 2"},{"p":"arquivos/temporei/foto03-p.jpg","g":"arquivos/temporei/foto03.jpg","w":600,"h":372,"leg":"Tempo Rei · foto 3"},{"p":"arquivos/temporei/foto04-p.jpg","g":"arquivos/temporei/foto04.jpg","w":600,"h":423,"leg":"Tempo Rei · foto 4"},{"p":"arquivos/temporei/foto05-p.jpg","g":"arquivos/temporei/foto05.jpg","w":600,"h":562,"leg":"Tempo Rei · foto 5"},{"p":"arquivos/temporei/foto06-p.jpg","g":"arquivos/temporei/foto06.jpg","w":600,"h":239,"leg":"Tempo Rei · foto 6"},{"p":"arquivos/temporei/foto07-p.jpg","g":"arquivos/temporei/foto07.jpg","w":600,"h":1194,"leg":"Tempo Rei · foto 7"},{"p":"arquivos/temporei/foto08-p.jpg","g":"arquivos/temporei/foto08.jpg","w":600,"h":383,"leg":"Tempo Rei · foto 8"},{"p":"arquivos/temporei/foto09-p.jpg","g":"arquivos/temporei/foto09.jpg","w":600,"h":369,"leg":"Tempo Rei · foto 9"},{"p":"arquivos/temporei/foto10-p.jpg","g":"arquivos/temporei/foto10.jpg","w":600,"h":394,"leg":"Tempo Rei · foto 10"},{"p":"arquivos/temporei/foto11-p.jpg","g":"arquivos/temporei/foto11.jpg","w":600,"h":394,"leg":"Tempo Rei · foto 11"},{"p":"arquivos/temporei/foto12-p.jpg","g":"arquivos/temporei/foto12.jpg","w":600,"h":401,"leg":"Tempo Rei · foto 12"},{"p":"arquivos/temporei/foto13-p.jpg","g":"arquivos/temporei/foto13.jpg","w":600,"h":398,"leg":"Tempo Rei · foto 13"}],"textos":["TEMPO REI …até que a tensão encontre uma abertura, e o que estava escondido atravesse a SUPERFÍCIE.","","","",""],"info":{"sobre":["Acordar, correr, chegar, produzir, repetir. O relógio dita o ritmo da cidade e de quem vive nela. TEMPO REI acompanha um dia em que o tempo deixa de ser medida e passa a ser personagem: na pressa da rua, na chegada ao trabalho, no absurdo do escritório e, por fim, na pausa que ninguém agendou. Entre o que se deve fazer e o que se deseja viver, fica a pergunta: quem governa o seu tempo?","O tempo se deposita em camadas sobre o corpo, entre aquilo que é imposto, aquilo que é ocultado e aquilo que insiste em permanecer, até que a tensão encontre uma abertura, e o que estava escondido atravesse a superfície."],"processo":["O desenvolvimento seguiu as etapas da metodologia MD3E, que orientou o percurso do projeto de forma aberta e adaptável ao longo de cerca de três meses.","Na pré-concepção, a pesquisa sobre o tempo como questão social e contemporânea, a análise de mercado e a análise de editoriais fundamentaram as decisões criativas. Na concepção, esses resultados foram traduzidos em conceito, moodboards, roteiros de cenário e definições de styling, beleza e linguagem fotográfica. Na pós-concepção, a produção em estúdio, a pós-produção e a proposta de publicação na Cartola Magazine concretizaram a narrativa visual do editorial."],"creditos":[["Direção criativa, fotografia e styling","João Pedro de Oliveira"],["Assistência de direção, fotografia e styling","Naila Sperotto"],["Modelo, beleza e cabelo","Nicole Reiser (@nicolereiser)"],["Locação","Estúdio fotográfico da Univali"],["Cenários","desenvolvidos com auxílio de inteligência artificial"],["Peças","look da coleção TEMPO REI e acervo pessoal"],["Pós-produção e fotocomposição","João Pedro de Oliveira"]]},"cw":600,"ch":239},{"id":"cenarios","grupo":"Editoriais","tipo":"editorial","destaque":true,"icone":"🏙️","curto":"Editorial de cenários","titulo":"Uma São Paulo que não existe","tag":"Editorial · 3 páginas","resumo":"Os cenários do editorial não existem: as fotos foram feitas em estúdio e os ambientes, criados com inteligência artificial.","ficha":"Publicado na Cartola #13, págs. 25 a 27","capa":"arquivos/cenarios/foto04-p.jpg","paginas":[{"src":"arquivos/cenarios/pag01.jpg","w":1400,"h":1980},{"src":"arquivos/cenarios/pag02.jpg","w":1400,"h":1980},{"src":"arquivos/cenarios/pag03.jpg","w":1400,"h":1980}],"fotos":[{"p":"arquivos/cenarios/foto01-p.jpg","g":"arquivos/cenarios/foto01.jpg","w":600,"h":866,"leg":"Cenários · foto 1"},{"p":"arquivos/cenarios/foto02-p.jpg","g":"arquivos/cenarios/foto02.jpg","w":600,"h":333,"leg":"Cenários · foto 2"},{"p":"arquivos/cenarios/foto03-p.jpg","g":"arquivos/cenarios/foto03.jpg","w":600,"h":506,"leg":"Cenários · foto 3"},{"p":"arquivos/cenarios/foto04-p.jpg","g":"arquivos/cenarios/foto04.jpg","w":600,"h":579,"leg":"Cenários · foto 4"},{"p":"arquivos/cenarios/foto05-p.jpg","g":"arquivos/cenarios/foto05.jpg","w":600,"h":600,"leg":"Cenários · foto 5"},{"p":"arquivos/cenarios/foto06-p.jpg","g":"arquivos/cenarios/foto06.jpg","w":600,"h":600,"leg":"Cenários · foto 6"}],"textos":["#PROCESSO Uma São Paulo que não existe Os cenários do editorial não existem. As fotos foram feitas no estúdio da Univali, sobre fundo neutro e com luz controlada, e os ambientes foram criados depois, com inteligência artificial: os prompts foram escritos no Claude, da Anthropic, e as imagens geradas no ChatGPT, da OpenAI. A cidade é São Paulo, reinventada num futuro próximo, com marcos reais em montagens impossíveis: o Edifício Martinelli no fim da Avenida Paulista, o Copan transformado em prédio comercial, o Ibirapuera com estruturas brancas em forma de árvore. A arquitetura mistura o brutalismo, o construtivismo e o futurismo, com vegetação tomando os prédios e neon só em pontos isolados. O lugar deixa de ser encontrado e passa a ser construído pela direção criativa do editorial. “Os cenários não existem. O lugar deixa de ser encontrado e passa a ser construído pela direção criativa do editorial.” 01 CAPA, MASP ↓ O roteiro acompanha a rotina de uma pessoa ao longo de vários dias, em quatro momentos: a rua, no trajeto para o trabalho; a fachada, na chegada; o escritório, durante o expediente; e o parque, quando a personagem abandona as obrigações. A irreverência cresce a cada cena, do descompasso na rua à ruptura no escritório, com papéis lançados ao ar. A paleta é sóbria, com cinzas, preto, branco e acentos de verde militar e bordô, para que a roupa seja a única área saturada da imagem. Na capa, a exceção: a modelo gigante se equilibra sobre um MASP em miniatura, como se a cidade coubesse sob seus pés. Ali, é ela quem domina a paisagem. Já o parque fecha a sequência com leveza e ironia.","↑ 02 RUA, VISTA DE FRENTE  03 RUA, VISTA DA ESQUINA ↓","↑ 04 FACHADA ↓ 05 ESCRITÓRIO ↓ 06 PARQUE"],"info":{"sobre":["Os cenários do editorial não existem. As fotos foram feitas no estúdio da Univali, sobre fundo neutro e com luz controlada, e os ambientes foram criados depois, com inteligência artificial: os prompts foram escritos no Claude, da Anthropic, e as imagens geradas no ChatGPT, da OpenAI.","A cidade é São Paulo, reinventada num futuro próximo, com marcos reais em montagens impossíveis: o Edifício Martinelli no fim da Avenida Paulista, o Copan transformado em prédio comercial, o Ibirapuera com DORADOCURSODE BACHARELADOEMDESIGNDEMODA 2026/2","INTRODUÇÃO 2026/2 O editorial de moda constitui uma forma de comunicação visual que articula fotografia, styling, direção criativa e ambientação na construção de narrativas (FRANGE, 2012). Por meio desses elementos, é possível ampliar os significados de uma coleção e explorar diferentes relações entre vestuário, corpo e contexto. A proposta deste projeto é o aprofundamento e a experimentação em direção criativa e fotografia, por meio da criação de um editorial de moda, utilizando como objeto de estudo um look autoral previamente desenvolvido para a coleção TEMPO REI, explorando novas possibilidades narrativas e visuais capazes de expandir o universo conceitual da coleção.","PROBLEMA OBLEMAJUSTIFICATIVA BLEMAJUSTIFICATIVAP LEMA JUSTIFICATIVA P BLEMA JUSTIFICATIVA EMA JUSTIFICATIVA PR LEMA EMAJUSTIFICATIVAPRO MAJUSTIFICATIVAPRO 2026/2 Como a direção criativa e a fotografia editorial podem ampliar o universo conceitual da coleção TEMPO REI por meio da construção de uma narrativa visual? A proposta deste projeto busca compreender diferentes formas de comunicação e construção de narrativas na moda. Como continuidade ao TIC I, que abordou os desfiles contemporâneos como práticas performáticas, o TIC II propõe-se a investigar a direção criativa e a fotografia editorial como ferramentas capazes de construir e expandir universos conceituais para além do vestuário, partindo da compreensão da imagem como um espaço capaz de produzir novas interpretações.","OBJETIVO GERAL Desenvolver um editorial conceitual de moda para a Cartola Magazine, a partir de um look autoral da coleção TEMPO REI, utilizando a direção criativa e a fotografia para ampliar sua narrativa visual. OBJETIVOS ESPECÍFICOS Investigar o editorial de moda como ferramenta de comunicação capaz de ampliar e construir universos narrativos para coleções e produtos de moda. Analisar referências de editoriais de moda que utilizem elementos visuais, simbólicos e conceituais na construção de narrativas. Explorar diferentes recursos de styling, fotografia, direção de arte e ambientação na construção de uma narrativa visual. 2026/2 Desenvolver um editorial de moda a partir de um look da coleção TEMPO REI, propondo uma interpretação e expansão de seu universo conceitual para além da apresentação em passarela.","METODOLOGIA 2026/2 O desenvolvimento de um projeto envolve diferentes etapas, decisões e procedimentos que precisam ser organizados de forma a conduzir o processo em direção aos objetivos estabelecidos. Nesse sentido, a utilização de uma metodologia projetual possibilita estruturar o percurso de desenvolvimento, auxiliando na organização das atividades e na tomada de decisões ao longo do projeto. Conforme Prodanov e Freitas (2013, p. 14), a metodologia consiste na “aplicação de procedimentos e técnicas que devem ser observados para construção do conhecimento”, contribuindo para a sistematização e condução do processo projetual. Para o desenvolvimento deste projeto, foi utilizada a metodologia MD3E — Método de Desdobramento em 3 Etapas, proposta por Santos (2005). Caracterizado como um método aberto, ele não estabelece uma sequência rígida e linear, permitindo que suas atividades sejam organizadas e desdobradas de acordo com as necessidades específicas de cada projeto. Segundo Santos (2005), o método aberto fornece uma base sobre a qual o projeto é desenvolvido, permitindo ao projetista definir não apenas o que deve ser realizado, mas também como conduzir as etapas subsequentes. A metodologia foi aplicada ao desenvolvimento do editorial de moda, adaptando seus desdobramentos às particularidades da proposta. A etapa de Pré-concepção contemplou o planejamento e as pesquisas necessárias para a compreensão do problema e a definição dos direcionamentos do projeto. Na Concepção, foram exploradas e desenvolvidas as possibilidades criativas para a construção do universo narrativo e visual do editorial. A Pós-concepção reuniu o planejamento da produção, a realização do ensaio fotográfico, a pós-produção das imagens e a elaboração da proposta de divulgação.","XOGRAMAFLUXOGRA XOGRAMAFLUXOGRAM OGRAMAFLUXOGRAM GRAMAFLUXOGRAMA GRAMAFLUXOGRAMA RAMAFLUXOGRAMAF FLUXOGRAMA ANÁLISE Foi realizada a análise de mercado e, a partir dela, elaborado o estado do design para aprofundar a compreensão do contexto do projeto; N C IA O NDÊ ÁT IC CO A NC E IT RO TE CAD O M NG A PL NE M JA EN TE ANÁLISE A FI TO AT RI BU PRÉ-CONCEPÇÃO M ERC AD O HOS CAMIN OS IV CRIAT PROBLEMA DE PROJETO OD A BO RD O ON ES STY BE CE NÁ RI LE L IN G ZA O TE TÉC N IC A G N TI AS , C OS . CI TC ÚN S E AN TO FO ES ST ENT OE EÇÃ ÇÃO L E A S QU AD E PRO D U ÇÃO EDITORIAL DO CU NEC M ENT ESS AÇÃ ÁRI O A MP ING PERSONA G AL ERA TE ÇÃ RN O AT D E IV A S NC ÇÃ CO EP A documentação necessária para a realização do projeto foi conferida e organizada; NC COMPONENTES EP CO ÃO Ç S E L TO SE FO CO STO RM Com o apoio das ferramentas criativas, foram desenvolvidos os moodboards de público, temático, conceito e macrotendência; a persona também foi detalhada. O brainstorming foi realizado com a equipe envolvida no editorial; ÇÃ S- Ç MA ÃO BRAIN O NECESSIDADE HUMANA PÓ RA S CAMINHOS CRIATIVOS O MATERIAL GRÁFICO AG TO OIC L B VO PÚ AL MO S SO ES VO S O C TI PR ODU PR 2026/2 M AC M ER ST IE C ME OMP RCA O ST O DO LÓ G IC DI Após a realização do editorial, foram selecionadas as fotografias e realizado o tratamento das imagens. Com as imagens tratadas, foi desenvolvida a diagramação; Foram definidos o conceito, a temática do editorial e o direcionamento do público-alvo; PO BR TO M EN M A T T R A IM A G E DE PROCESSOS PRODUTIVOS PA M A TAL N ME O Na finalização do projeto, foi elaborado o material gráfico para o composto mercadológico destinado à Cartola Magazine; PR Na primeira etapa, foi realizado o planejamento do projeto. Para isso, foram elaborados o briefing, a proposta e os objetivos que orientaram o desenvolvimento, além de um mapa mental para organizar e alinhar as ideias; MERCADO ESTADO DO DESIGN PLANEJAMENTO ATRIBUTOS GERAÇÃO DE ALTERNATIVAS Nessa etapa, foram escolhidos e detalhados o cenário, a beleza, a linguagem fotográfica e o styling; SELEÇÃO E ADEQUAÇÃO Nessa etapa, foram definidos os integrantes da equipe e elaboradas as fichas com as informações necessárias para a produção. Também foram planejados os testes para orientar a execução e evitar imprevistos. Após essa preparação, a produção editorial foi realizada;","2026/2 MAPA MENTAL O mapa mental é uma ferramenta utilizada para organizar informações de forma visual, estabelecendo relações entre diferentes conceitos a partir de um tema central. Sua estrutura permite reunir palavras-chave, referências e ideias, facilitando a compreensão e o desenvolvimento das relações entre os elementos pesquisados. Para Buzan (2009), a construção de mapas mentais estimula o uso associado de palavras e imagens, ampliando as possibilidades de exploração e desenvolvimento das ideias ao longo do processo. Neste projeto, o mapa mental foi utilizado para reunir e relacionar os principais conceitos vinculados ao editorial de moda, auxiliando na organização das referências e na definição dos direcionamentos que conduziram a construção do universo narrativo do projeto.","aceleração Elle contemplação escassez autonomia camadas Vogue costuras O TEMPO materializa Claudia silhuetas REFERÊNCIAS Marie Claire imagem de moda O LOOK EDITORIALDE MODA cor traduz TEMPOREI significação narrativa MODA EDITORIAL identidade direção criativa circula MERCADO corpo fotografia diversidade linguagem 2026/2 digital Instagram Cartola Magazine styling","DA MODA MODA MOD MODA DAMODAMODAMODA AMODAMODAMODA MODAMODAMODA MODAMODAMODA ODAMODAMODA 2026/2 A moda ultrapassa a função prática do vestuário, constituindo uma linguagem por meio da qual os sujeitos constroem e comunicam aspectos de sua identidade. Castilho e Martins (2005) permitem compreender a roupa como parte de um sistema de significação relacionado ao corpo, à subjetividade e ao contexto social. Seus sentidos, portanto, não dependem apenas das características da peça, mas também das formas como ela é usada e apresentada. A capacidade de produzir sentidos permite à moda expressar tensões presentes na sociedade, como as diferentes formas de vivenciar e controlar o tempo. Na contemporaneidade, a aceleração dos ritmos de vida e a valorização da produtividade intensificam a sensação de escassez temporal, enquanto as desigualdades sociais condicionam a possibilidade de descansar, contemplar e exercer autonomia sobre o próprio tempo.","2026/2 IMAGEM DE MODA A imagem de moda não se limita a registrar ou apresentar o vestuário, constituindo uma produção visual e cultural por meio da qual são construídos e comunicados significados. Sua interpretação está relacionada não apenas àquilo que é representado, mas também ao contexto histórico e social em que a imagem é produzida e recebida. Dessa forma, as imagens de moda participam da construção e da circulação de valores, comportamentos e representações que refletem e influenciam as formas de compreender o corpo, a aparência e a sociedade. Rainho (2018), ao investigar os atos performativos e a construção de sujeitos nas fotografias de moda, contribui para compreender essas imagens como produções culturais que participam da elaboração de representações. Seus significados, portanto, não são fixos nem independentes de seu contexto, pois se constituem na relação entre a imagem, as referências culturais de seu tempo e os modos como ela é interpretada. Compreender a imagem de moda implica, assim, reconhecê-la como uma forma de comunicação visual que participa da produção de sentidos e das construções simbólicas de uma sociedade.","COMPONENTES DA IMAGEM DE MODA 2026/2 A criação de uma imagem de moda envolve a articulação de diferentes componentes, como styling, pose, cenário, iluminação, enquadramento e composição fotográfica. Frange (2012) contribui para compreender esses elementos como aspectos que podem ser analisados individualmente, sem perder de vista sua integração na construção da imagem. Seus efeitos dependem das relações que estabelecem entre si e da proposta conceitual que orienta a produção. No editorial de moda, esses componentes participam da tradução visual do conceito. O styling interfere na percepção da silhueta e da materialidade do vestuário, enquanto a pose e o gesto orientam a leitura do corpo. O cenário situa a peça em um contexto e lhe atribui novos sentidos, e a iluminação pode acentuar texturas, produzir contrastes e modificar a percepção do espaço. O enquadramento e a composição fotográfica definem o que a imagem coloca em evidência. Assim, a coerência da imagem resulta da articulação entre os componentes e o universo conceitual do editorial.","TORIALEDITORIAL DEMODA EDITO DE MODA ORIALDEMODAEDITO RIAL DE MODA EDITOR ORIAL RIALDEMODAEDITORIA EDITORI ALDEMODAEDITORIA ALDEMODAEDITORIAL 2026/2 O editorial de moda constitui uma produção visual orientada por um conceito que direciona a construção e a articulação das imagens. Esse conceito não funciona apenas como um tema ou uma ideia inicial, mas como um princípio organizador que estabelece relações entre o vestuário e os sentidos que se pretende explorar. Por meio dessa construção, o editorial pode articular referências culturais, valores e imaginários sociais, situando a moda em contextos que ampliam as possibilidades de interpretação da aparência. Assim, as imagens não se limitam a apresentar as peças, mas participam da elaboração de discursos visuais sobre o corpo, a identidade e a sociedade. A proposta conceitual também orienta a unidade visual e narrativa do editorial, estabelecendo relações entre as fotografias que o constituem. Essas relações podem produzir continuidade, contraste, transformação ou associação, fazendo com que os significados emerjam tanto de cada imagem quanto da sequência como um todo. O editorial configura-se, assim, como uma forma de comunicação visual na qual o conceito é desenvolvido por meio das imagens, sem que seus sentidos sejam inteiramente determinados pela intenção de quem as produz.","ANÁLISE DE EDITORIAIS Para investigar como diferentes escolhas visuais participam da construção de sentidos na moda, foram analisados dois editoriais a partir de critérios comuns: direção criativa e universo conceitual, styling e vestuário, corpo e espaço, fotografia e composição, enquadramento e espaço, iluminação e atmosfera, e narrativa visual e sequência. A análise considera tanto os recursos empregados em cada fotografia quanto as relações estabelecidas entre as imagens que compõem a sequência. A comparação permitiu identificar diferentes estratégias de construção visual e extrair princípios projetuais que possam fundamentar o desenvolvimento do editorial de TEMPO REI, sem reproduzir diretamente as soluções visuais das referências. 2026/2","SEGUNDO ATO: O EDITORIAL QUE AMPLIA NOSSOS OLHARES 1. Direção criativa e universo conceitual: O editorial parte de um conceito declarado que propõe repensar os códigos do trabalho, os gestos cotidianos e os papéis sociais, entendendo o tempo como matéria plástica. A alternância entre fotografias de moda, com as modelos vestindo as peças, e fotografias still, naturezas-mortas formadas somente por objetos, mostra que o universo conceitual não depende só dos corpos vestidos: os objetos assumem papel narrativo próprio. As naturezas-mortas reúnem objetos de escritório e itens de lazer e cuidado pessoal, o que aproxima trabalho e vida privada e dialoga com os gestos cotidianos do conceito. O relógio recorrente materializa o tema do tempo e sugere, como hipótese, sua suspensão, enquanto as mãos com telefones que invadem o quadro interrompem o retrato e traduzem a interferência externa sobre o espaço pessoal. 2. Styling e vestuário: O styling parte da alfaiataria, com blazers estruturados, calças amplas e vestidos ajustados em tons predominantes de caramelo, marrom e terracota, e a repetição do vestido e do conjunto caramelo cria continuidade entre cenas distintas e sustenta a leitura do editorial como uma única narrativa. A alfaiataria, vocabulário formal associado ao trabalho, é deslocada de seu uso convencional: o blazer cinza apoiado sobre os ombros, sem vestir as mangas, e a camisa branca de volume exagerado com a gravata de risca de giz ampliam a silhueta, criam contraste de proporções e desfazem a rigidez esperada do traje formal. As sobreposições reforçam esse uso não convencional das peças. Ao preservar o vocabulário formal e alterar sua forma de uso, o styling traduz o conceito de repensar os códigos do trabalho. 3. Corpo e espaço: Os corpos são posicionados em relação a móveis, plataformas e objetos de escritório de modo a deslocar a postura profissional esperada nesse ambiente. Ao apoiar-se sobre a mesa ou reclinar-se na cadeira com o blazer sobre os ombros, as modelos ocupam o espaço de trabalho sem a rigidez de uma pose de apresentação, e a roupa passa a ser lida na relação com o corpo e o mobiliário. Em contraponto, o modelo cercado por mãos que seguram telefones tem seu espaço corporal invadido. A oposição entre apropriação e invasão do espaço sugere uma tensão entre autonomia, postura profissional e interferências externas, em consonância com o conceito declarado. 2026/2 4. Fotografia e composição: O editorial alterna planos abertos, retratos aproximados e naturezas-mortas, e cada um desempenha uma função distinta. Nos planos abertos, o relógio e o mobiliário estruturam o cenário e apresentam o ambiente de trabalho como espaço construído. Nas naturezas-mortas, os equilíbrios instáveis e os agrupamentos assimétricos, como a pilha de materiais de escritório, conferem aos objetos uma instabilidade que, como leitura interpretativa, dialoga com a ideia de tempo como matéria plástica. Os retratos aproximados deslocam a atenção para expressões, acessórios e detalhes da alfaiataria. A alternância de escalas cria um ritmo visual que impede que a sequência se reduza à exposição das roupas.","TOF OFFICE OUT OF OFF TOF OFOFFICEOUTOFOFFI OFF F OFFICE OUT OF OFFIC OF FOFFICE OUT OF OFFICE FOFFICE OFFICEOUTOFOFFICE FFICEOUTOFOFFICEO 5. Enquadramento e espaço: O enquadramento alterna entre a visualização integral dos corpos e recortes que priorizam rostos, roupas ou objetos, e essa variação define o que cada imagem coloca em evidência. Nas imagens de corpo inteiro, mesas, cadeiras, arquivos e plataformas delimitam a área ocupada pelas modelos e integram o vestuário ao ambiente corporativo, de modo que a roupa é lida dentro do espaço de trabalho. Nos recortes mais fechados, como o retrato de blazer terracota, o olhar se aproxima dos detalhes da alfaiataria e dos acessórios. Os relógios parcialmente cortados e os elementos que atravessam as bordas ampliam a sensação de continuidade para além do quadro, o que pode ser lido, como interpretação, como a ideia de um tempo que segue fora da imagem. 6. Iluminação e atmosfera: A iluminação varia entre sombras alongadas, áreas de luz concentrada e fundos em degradê, e essa variação diferencia as cenas. A luz mais dura e fria na modelo diante da máquina de costura evidencia as superfícies e acompanha uma aparência granulada, enquanto a luz que incide sobre o chão alonga as sombras da cadeira e dos objetos de escritório. Nas naturezas-mortas, o ponto luminoso amarelado do globo contrasta com o fundo neutro e destaca o objeto. Esses contrastes constroem uma atmosfera controlada, entre familiaridade e estranhamento, em consonância com a proposta de repensar os gestos cotidianos: o ambiente de trabalho é reconhecível, mas deslocado. 2026/2 Ficha técnica: Editorial “Out of Office”, publicado na matéria “Segundo Ato: o editorial que amplia nossos olhares”, da Moda Tech, em 13 de maio de 2025 (SPLENDORE, 2025). Direção criativa: Gabriela Splendore. Fotografia de moda: Leonardo Fagherazzi. Fotografia still: Júlia Zeidler. Direção de fotografia: Letícia Sousa. Produção de arte: Isadora Otero. Styling: Carol Veríssimo. Beleza: Carolina Felício. Modelos: Luiza Tozelli, Iberê Nakamura e Juliana Ribeiro. Material analisado: 10 duplas de páginas disponibilizadas, de um total de 12 spreads do editorial. 7. Narrativa visual e sequência: A sequência alterna retratos de moda e naturezas-mortas, relacionando a presença dos modelos a objetos associados ao cotidiano profissional e pessoal. Telefones, calculadora, relógio, máquina de costura e materiais de escritório reaparecem como elementos que aproximam as imagens do universo do trabalho, e a repetição do relógio estabelece continuidade entre as composições, enquanto as mudanças de pose, enquadramento e vestuário evitam uma apresentação uniforme. Assim, a sequência sugere uma reflexão sobre os códigos profissionais e a relação com o tempo, em consonância com o conceito declarado do editorial.","2026/2 UNE MATINÉE PARISIENNE 1. Direção criativa e universo conceitual: O editorial constrói seu universo em espaços urbanos de Paris, e ruas, fachadas de pedra, bancos públicos e elementos arquitetônicos participam da composição como parte da narrativa, e não apenas como fundo. A mala de viagem e a gravata preta recorrente introduzem ideias de deslocamento e formalidade, que as poses pouco convencionais tensionam. A alternância entre alfaiataria azul, peças escuras e roupas drapeadas cria variações dentro da mesma narrativa visual. Como hipótese visual, essas escolhas sugerem uma relação entre viagem, cotidiano e identidade. 2. Styling e vestuário: O styling combina elementos clássicos da alfaiataria com peças casuais e proporções inesperadas, e é nessa mistura que constrói seu discurso. O blazer riscado usado com regata, short xadrez, meias escuras e sapatos oxford desloca a formalidade do paletó, e o terno azul trespassado com regata cinza e gravata solta mantém o código formal ao mesmo tempo que o descontrai. Nas outras modelos, os tecidos drapeados em tons terrosos e os acessórios de destaque contrastam com o conjunto xadrez de mangas volumosas e saia amarrada. A combinação de códigos formais, casuais e ornamentais produz variedade visual e sugere uma aparência que não se prende a uma única categoria. 3. Corpo e espaço: As poses estabelecem relações contrastantes entre o corpo e o espaço urbano. Diante do portão, o modelo mantém a mão sobre a mala; em outra cena, senta-se no chão e puxa a gravata, e o gesto rompe a compostura associada à alfaiataria. Ao inclinar-se contra a parede e ocupar o banco em posições reclinadas, o conjunto azul passa a usar a cidade como superfície de apoio. As outras modelos também se apoiam em pilares e paredes ou assumem posições agachadas, e a arquitetura deixa de ser cenário para tornar-se suporte do corpo. Essas poses deslocam as posturas convencionais de apresentação. 4. Fotografia e composição: A fotografia usa a arquitetura parisiense como fundo e como elemento de organização visual, combinando planos abertos e enquadramentos aproximados. O portão escuro e a folhagem contrastam com o vestuário, e a mala reforça a composição vertical; no plano amplo, o espaço vazio da parede destaca o corpo sentado próximo ao chão; e o pilar desfocado em primeiro plano funciona como moldura parcial da modelo. Em outro registro, o enquadramento aproxima o torso e as mãos que ajustam a gravata. A variação de escala direciona a atenção ora para a relação entre modelo e espaço, ora para as poses e as roupas.","5. Enquadramento e espaço: As fotografias alternam planos de corpo inteiro e enquadramentos mais fechados, mantendo a arquitetura urbana como referência espacial. Nos planos amplos, como o do corpo diante do portão com a mala e o da parede que ocupa grande parte do quadro, o espaço vazio ao redor do corpo evidencia a escala da cidade. O enquadramento baixo acompanha a modelo agachada, aproximando o olhar do nível do chão, e o recorte do torso prioriza o gesto de ajustar a gravata. Esses cortes variam a relação entre corpo e ambiente, ora evidenciando o espaço, ora concentrando a atenção na pose e no vestuário. 6. Iluminação e atmosfera: A luz natural difusa dos dias nublados mantém sombras pouco marcadas e uma aparência visual relativamente uniforme. Nas imagens feitas sobre o piso molhado, a superfície escura reforça os tons frios e terrosos das roupas sem criar contrastes luminosos intensos, e o conjunto azul se destaca diante das fachadas claras e dos elementos urbanos neutros. Em uma das imagens, os tecidos em degradê contrastam com o pilar metálico cinza e a paisagem ao fundo. A atmosfera resulta da combinação entre luz suave, cores urbanas e superfícies úmidas, o que concentra a atenção nas roupas e nas poses, e não no efeito de luz. 7. Narrativa visual e sequência: A sequência organiza as dez fotografias em três grupos de modelos: as seis primeiras acompanham o mesmo modelo, seguidas por duas imagens de outra modelo e duas de uma terceira. A continuidade do primeiro grupo é reforçada pela repetição da gravata preta, do conjunto azul e da mala, e a Torre Eiffel conecta visualmente a última imagem desse grupo à seguinte, enquanto o banco verde reaparece em imagens de modelos diferentes. Essas recorrências unem os grupos pela cidade, e as mudanças de roupa, pose e cenário introduzem variação sem romper a unidade urbana. A sequência sugere, como hipótese, uma narrativa de deslocamento e cotidiano. 2026/2 Ficha técnica: Editorial “Une Matinée Parisienne”, publicado pela KALTBLUT (UNE..., 2026). Publicação: KALTBLUT. Material analisado: 10 fotografias disponibilizadas, de um total de 19 imagens da publicação. Locações: espaços urbanos externos de Paris, incluindo ruas, pontes, fachadas e bancos públicos. Créditos de direção criativa, fotografia, styling, beleza e equipe: não informados no material disponibilizado.","TESE COMPARATIVA SÍN SÍ SÍNTESE COMPARATIVA ESECOMPARATIVASÍN SECOMPARATIVASÍNT E COMPARATIVA SÍNTE SE SÍNT ECOMPARATIVA SÍNTE ECOMPARATIVA COMPARATIVASÍNTES 2026/2 Os dois editoriais deslocam a alfaiataria de seu uso convencional, mas o fazem por caminhos distintos. Em “Out of Office”, o conceito declarado de repensar os códigos do trabalho se materializa no ambiente de escritório: relógios, telefones, arquivos e calculadoras reaparecem tanto nas fotografias de moda quanto nas naturezas-mortas, e as modelos se apoiam na mesa ou se reclinam na cadeira com o blazer sobre os ombros, enquanto o modelo cercado por mãos com telefones tem seu espaço invadido. O vestuário formal é desestabilizado em relação aos objetos e ao mobiliário do trabalho. Em “Une Matinée Parisienne”, a mesma operação ocorre em relação à cidade: ao sentar-se no chão e puxar a gravata, ou ao inclinar-se contra a parede e ocupar o banco, o modelo desloca a formalidade do conjunto azul, e a arquitetura urbana deixa de ser fundo para tornar-se suporte do corpo. A unidade de cada editorial é construída por elementos de natureza diferente. Em “Out of Office”, ela depende da repetição de objetos e peças, em especial o relógio, o vestido e o conjunto caramelo, e da alternância entre retratos e naturezas-mortas, que amplia o universo para além das roupas e dá aos objetos papel narrativo próprio. Em “Une Matinée Parisienne”, a continuidade vem da permanência do espaço urbano e da recorrência de elementos como o banco verde, a gravata preta e a mala, enquanto a Torre Eiffel liga visualmente modelos diferentes. A iluminação acompanha essa diferença: a luz variada de “Out of Office”, com sombras alongadas e fundos em degradê, constrói uma atmosfera controlada, entre familiaridade e estranhamento, e a luz difusa de “Une Matinée Parisienne” mantém uma aparência uniforme que concentra a atenção nas roupas e nas poses. Em ambos os casos, a direção criativa aparece como organização de relações entre corpo, objeto ou espaço, luz e sequência, e não como simples escolha de roupas ou cenários. A diferença está na origem do sentido: em “Out of Office”, as escolhas visuais respondem a um conceito declarado sobre trabalho e tempo; em “Une Matinée Parisienne”, o sentido emerge da relação entre corpo e cidade, e a leitura de uma narrativa de deslocamento e cotidiano é uma hipótese visual. Nos dois, as roupas ganham sentidos que ultrapassam suas características materiais, pois dependem das poses, dos ambientes e da sequência em que aparecem. Dessa comparação é possível extrair princípios projetuais para TEMPO REI, sem reproduzir as soluções visuais das referências. Primeiro, a continuidade de um editorial pode ser sustentada por um elemento recorrente, seja um objeto, uma peça ou um espaço, desde que ele carregue o conceito. Segundo, a tensão central do conceito, aqui entre rigidez e fluidez, pressão e liberdade, controle e contemplação, pode ser construída na relação entre o corpo e o ambiente, e não apenas na roupa. Terceiro, alternar escalas e tipos de imagem amplia o universo da coleção para além da apresentação do look. Por fim, a luz funciona como parte do discurso: sua variação ou sua uniformidade orienta o que o olhar percebe primeiro.","CRITÉRIO OUT OF OFFICE (2025) — MODA TECH UNE MATINÉE PARISIENNE — KALTBLUT DIREÇÃO CRIATIVA E UNIVERSO CONCEITUAL Conceito de repensar os códigos do trabalho e o tempo, com objetos de papel narrativo próprio. Universo construído na cidade de Paris, com deslocamento e formalidade como ideias recorrentes. STYLING E VESTUÁRIO Alfaiataria em caramelo, marrom e terracota usada de forma não convencional. Alfaiataria clássica misturada a peças casuais e proporções inesperadas. CORPO E ESPAÇO Modelos que se apoiam, se reclinam ou têm o espaço invadido, entre autonomia e interferência. Poses no chão, na parede e no banco fazem da arquitetura um suporte do corpo. FOTOGRAFIA E COMPOSIÇÃO Alterna planos abertos, retratos e naturezas-mortas, com objetos em equilíbrios instáveis. Usa a arquitetura parisiense como organização visual, em planos abertos e aproximados. ENQUADRAMENTO E ESPAÇO Integra o corpo inteiro ao escritório e aproxima detalhes; relógios cortados sugerem continuidade. Alterna corpo inteiro e recortes fechados, variando a relação entre corpo e cidade. ILUMINAÇÃO E ATMOSFERA Luz variada, sombras alongadas e fundos em degradê criam uma atmosfera controlada. Luz difusa e piso molhado dão aparência uniforme e concentram a atenção nas roupas. NARRATIVA VISUAL E SEQUÊNCIA Objetos e peças que se repetem, como o relógio, dão continuidade entre retratos e naturezas-mortas. Dez imagens em três grupos de modelos unidas pelo espaço urbano e por elementos recorrentes. PRINCIPAL CONTRIBUIÇÃO PARA A ANÁLISE Evidencia como objetos e situações corporais podem reconstruir um universo temático. Demonstra como a relação entre vestuário, pose e cidade pode construir uma narrativa de deslocamento. 2026/2 A análise dos editoriais contribuiu para a definição das estratégias visuais de TEMPO REI, principalmente na relação entre corpo, vestuário e ambiente. A utilização dos espaços como elementos narrativos e a alternância de enquadramentos orientaram a construção dos cenários e a organização da sequência fotográfica.","2026/2 TEMPO REI O tempo se deposita em camadas sobre o corpo, entre aquilo que é imposto, aquilo que é ocultado e aquilo que insiste em permanecer, até que a tensão encontre uma abertura, e o que estava escondido atravesse a superfície.","EMPOCOMOQUESTÃO MPOCOMOQUESTÃO MPOCOMOQUESTÃOS POCOMOQUESTÃOSO OCOMOQUESTÃOSO OCOMOQUESTÃOSOC O TEMPO COMO QUESTÃO SOCIAL E CONTEMPORÂNEA Na sociedade contemporânea, a disponibilidade de tempo está relacionada às condições sociais e econômicas que atravessam a vida cotidiana. Enquanto algumas pessoas enfrentam jornadas extensas de trabalho, deslocamentos e responsabilidades que limitam suas possibilidades de descanso, outras dispõem de maior autonomia para decidir como utilizar seu tempo. Essa desigualdade evidencia que, embora o tempo cronológico seja compartilhado por todos, as condições de vivenciá-lo não são as mesmas. Giurge, Whillans e West (2020) discutem esse cenário a partir do conceito de pobreza de tempo, entendida como a sensação persistente de ter mais demandas do que tempo para atendê-las, e relacionam essa condição a prejuízos ao bem-estar e à saúde. A moda não está fora desse regime temporal: ela o absorve e o torna visível no corpo. Em uma sociedade na qual, segundo Rosa (2019), aceleram-se os processos técnicos, as transformações sociais e o próprio ritmo de vida, o vestuário passa a responder tanto à pressa quanto à pressão de acompanhar as mudanças. Para quem concentra trabalho, deslocamentos e compromissos em um mesmo dia, a roupa tende a ser pensada pela eficiência, com peças versáteis, adaptáveis e que dispensam trocas. Para quem tem autonomia sobre a rotina, o vestir pode se abrir à escolha, à combinação e à experimentação. A roupa deixa de ser apenas objeto de consumo e passa a registrar, no corpo, o modo como cada pessoa dispõe do próprio tempo. A relação entre moda e tempo, portanto, não se limita ao ritmo de renovação das coleções: envolve as condições que determinam o que se pode vestir, quando e com quanta liberdade. 2026/2","","19/09/2 026 26/09/2 026 03/10/2 6 02 7/2 8/0 06/06/20 26 04/04/20 26 28/03/20 26 05/09/20 26 29/08/20 26 Na coleção, essa reflexão é materializada por meio de contrastes formais que expressam diferentes condições de experiência. No primeiro núcleo, a escassez é traduzida em silhuetas geométricas, estruturas rígidas, cortes precisos e tecidos encorpados, enquanto fios aparentes, sobreposições e costuras inacabadas evidenciam as tensões e os desgastes associados à rotina acelerada. Em contraponto, o segundo núcleo explora silhuetas amplas, tecidos leves e formas fluidas, articulando volume, estabilidade e a possibilidade de desacelerar e contemplar. 22/08 / 6 2 0 2 6 202 04/ 11/ 13/06/ 30/05/20 2 A construção têxtil também participa desse discurso. As camadas sobrepostas são atravessadas por costuras verticais que percorrem as peças e revelam progressivamente o que permanece oculto. A cartela cromática combina roxo, laranja, verde, azul e vermelho, que surge entre as camadas como uma interrupção, sugerindo algo latente que encontra espaço para emergir. Dessa forma, a materialidade, a estrutura e a cor não atuam apenas como recursos estéticos: tornam visíveis as tensões entre imposição e liberdade, ocultamento e revelação que fundamentam o conceito da coleção. 23/05/20 26 1 6 / 0 5 / 2 0 26 26 09/0504/20 25/ /2026 6 202 04/ 18/ 02/05/20 26 26 /20 /07 07 6 202 06/ 20/ 12/09/2 026 6 202 06/ 27/ 26 /20 /07 21 O desenvolvimento da TEMPO REI partiu do desafio de traduzir visualmente uma questão abstrata: como representar o tempo por meio do vestuário? Ao longo do processo, essa busca levou à compreensão de que o tempo não se manifesta apenas como uma sucessão linear de instantes, mas também se acumula, atravessa e transforma aquilo que toca. 26 /20 /07 14 1 5 / 0 8 / 2 0 26 08/08/20 26 01/08/20 2026/2 MATERIALIZAÇÃO","MPOREITEMPOREITEM POREITEMPOREITEM O REI TEMPO REI TEMP PO OREITEMPOREITEMPO REITEMPOREITEMPO REITEMPOREITEMPOR 2026/2","2026/2 MERCADO O mercado editorial de moda passa por uma reorganização que combina duas mudanças. As revistas migraram para sites e redes sociais, e as fotografias e narrativas editoriais passaram a circular em vários canais ao mesmo tempo. Bueno, Fonseca Barros e Alves (2023) mostram, a partir da perspectiva dos editores, que essa mudança obriga as revistas a repensar a forma de atuar no ambiente digital. Ao mesmo tempo, a periodicidade mensal perdeu espaço e as publicações impressas permanecem em edições menos frequentes, mais autorais e feitas para durar (FERNANDEZ, 2019). Nesse cenário, o editorial de moda continua sendo uma forma de comunicação visual que articula direção criativa, styling e vestuário, corpo e espaço, fotografia e composição, enquadramento, iluminação e narrativa visual, e também constrói discursos sobre cultura, comportamento e identidade. Quando as imagens circulam em ritmo acelerado, a revista que faz poucas edições e dedica mais tempo à produção propõe ao leitor outra relação com o tempo, mais lenta que a do feed. Em um estudo com seis revistas brasileiras de moda, Bueno e Sousa (2024) analisaram 3.083 publicações no Instagram e constataram que as pautas de diversidade ainda ocupam pouco espaço e aparecem, muitas vezes, de forma estereotipada. Assim, analisar o mercado exige olhar para os formatos e canais de circulação e também para as escolhas visuais e temáticas com que cada editorial dá sentido ao corpo, à roupa e à sociedade.","CARTOLA MAGAZINE A Cartola Magazine é uma publicação independente de cultura, arte, moda e comportamento brasileiro, criada em 2014 pelo diretor criativo Arthur Anjos. Depois de atuar em grandes agências de publicidade, Arthur fundou a revista para construir uma plataforma editorial dedicada a esses temas (FREITAS, 2026). Hoje ela integra a Alkmist, agência de comunicação que trabalha com marketing, branding, conteúdo e design, e circula em edições impressas, no site e nas redes sociais. A revista é feita por jornalistas e profissionais de comunicação e entrega conteúdo em uma linguagem disruptiva, que acompanha moda, comportamento e cultura. A edição impressa mais recente, lançada em julho de 2026, tem como tema Suspensão e trata dos períodos de transição que marcam a contemporaneidade. Traz a cantora Jaloo na capa, uma conversa com Fernanda Abreu e reportagens sobre arte, gastronomia, comportamento e moda (FREITAS, 2026). Os editoriais de moda dessa edição foram produzidos por estudantes do Senac Lapa Faustolo, de São Paulo, o que mostra a abertura da revista a novos criadores. O lançamento aconteceu em São Paulo, Recife e Natal e reforça a proposta de olhar para um Brasil em movimento, com diferentes territórios, sotaques e expressões culturais. 2026/2","ESTADO DODESIGN DESIGN ADO DO ESTAD ADODODESIGNESTAD DODODESIGNESTADO ODODESIGNESTADO ODO DESIGN ESTADO D ODO DODESIGNESTADODO O estado do design reúne profissionais que já atuam na área em que este trabalho se insere, para identificar repertórios, formatos e modos de trabalhar. Observar o que já existe ajuda a entender como diferentes profissionais constroem a imagem de uma revista de moda, que escolhas fazem e por que caminhos chegam a cada resultado. A pesquisa se concentra em quem trabalha com direção criativa e editorial de moda para revistas. Foram escolhidos três profissionais de trajetórias diferentes, Giovanni Bianco, Edward Enninful e Ib Kamara, que constroem universos visuais que vão além da roupa e pensam a revista como um conjunto de imagem, texto e narrativa. Para comparar o trabalho de cada um, foi usada a análise dos 4 Ps, que organiza produto, preço, praça e promoção e mostra como cada profissional oferece e divulga o que faz. 2026/2","2026/2 GIOVANNI BIANCO Diretor criativo ítalo-brasileiro, nascido no Brasil e radicado em Nova York, onde fundou em 2001 a agência GB65. Começou a trabalhar com moda ao criar a identidade visual da Dolce & Gabbana e desde então assina campanhas de marcas como Versace, Miu Miu, Dsquared2 e Salvatore Ferragamo (BUSINESS OF FASHION, [2026b?]). No campo editorial, foi diretor criativo da Vogue Itália de setembro de 2017 a junho de 2019, com a função de conduzir o redesenho gráfico da revista e supervisionar os editoriais de moda (IODICE, 2017; SCUDERI, 2017). Também colaborou com a V Magazine, a L’Uomo Vogue, a Vogue Japão e a Vogue Coreia, e assinou a direção criativa da edição de 40 anos da Vogue Brasil (SOUZA, 2015). Site: giovannibianco.com. Instagram: @gb65.","EDWARD ENNINFUL Editor e stylist britânico nascido em Gana. Aos 18 anos assumiu a direção de moda da i-D, passou pela Vogue Itália, pela Vogue americana e pela W e, a partir de 2017, foi editor-chefe da Vogue britânica, a primeira pessoa negra nesse cargo. Também foi diretor editorial europeu da Vogue (BUSINESS OF FASHION, [2026a?]). Em 2025 fundou a EE72, empresa de mídia e entretenimento, e lançou a 72 Magazine, publicação trimestral impressa e digital produzida sem anúncios (FASHIONUNITED, 2025; SEGRAN, 2025). Sua atuação reúne styling, direção editorial e criação de conteúdo, com destaque para a diversidade na escolha de modelos e personalidades. Essa abordagem amplia as representações de beleza, identidade e cultura nas imagens de moda. Site: ee72.com. Instagram: @edward_enninful. 2026/2","IB KAMARA AMARAIBKAMARA IBK MARAIBKAMARAIBKA MARAIBKAMARAIBKAM KA ARAIBKAMARAIBKAM ARAIBKAMARAIBKAMA KAM RAIBKAMARAIBKAMA Stylist, jornalista e diretor criativo nascido em Serra Leoa e radicado em Londres, onde estudou na Central Saint Martins. Prestou consultoria a marcas como Louis Vuitton, Chanel, Burberry e Gucci e colaborou com artistas como Rihanna e Beyoncé (THE IMPRESSION, [2026?]). Assumiu o cargo de editor-chefe da Dazed em 2021 e, em 2022, tornou-se Art & Image Director da Off-White, cargo em que passou a orientar a imagem e o conteúdo da marca (ADEGEEST, 2022). Seu trabalho se caracteriza pela experimentação no styling, combinando peças, volumes e referências culturais para transformar a aparência dos corpos e construir imagens que desafiam convenções da moda. Sua produção também integrou exposições na Somerset House, em Londres, e no Victoria & Albert Museum. 2026/2 Site: artandcommerce.com/artists/ib-kamara. Instagram: @ibkamara.","GIOVANNI BIANCO EDWARD ENNINFUL IB KAMARA PRODUTO Direção criativa e direção de arte para campanhas, editoriais, identidade visual de marcas e projetos de revistas. Styling, direção de moda e direção editorial de revistas, além de conteúdo e produtos de mídia. Styling e direção criativa de editoriais e de marcas de moda, com foco em imagem e narrativa. PREÇO Não divulgado. Não divulgado. Não divulgado. PRAÇA Nova York, com atuação em Milão e no Brasil. Londres, com atuação internacional. Londres e Milão, com atuação internacional. PROMOÇÃO Divulgação por meio da agência GB65, de revistas internacionais e de campanhas de grandes marcas. Divulgação por meio da 72 Magazine, impressa e digital, e das revistas em que atuou. Divulgação por meio de revistas, exposições e colaborações com marcas e artistas. 4 Ps 2026/2","CONCORRENTES A análise de concorrentes reúne publicações que disputam a atenção do mesmo leitor da Cartola Magazine e ajuda a entender como cada uma se posiciona, o que oferece e por onde circula. Observar quem já ocupa esse espaço mostra onde o mercado se repete e onde ainda existe lugar para uma proposta diferente. Foram escolhidas três revistas brasileiras que publicam moda, cultura e comportamento em formato impresso e digital, a Amarello, a ELLE Brasil e a ForbesLife Fashion. A escolha permite observar diferentes propostas editoriais e compreender como essas publicações organizam seus conteúdos, definem seu posicionamento e estabelecem relações com o público. A comparação considera tanto as características das revistas quanto suas estratégias de circulação e divulgação, oferecendo referências para compreender o espaço que a Cartola Magazine pretende ocupar. 2026/2","ARELLOAMARELLOAM RELLOAMARELLOAMA AM RELLOAMARELLOAMA ELLOAMARELLOAMAR LLOAMARELLOAMARE AMAR LOAMARELLOAMARE 2026/2 AMARELLO A Amarello é uma revista independente brasileira de arte, cultura, design, sociedade e comportamento, publicada desde 2008 e criada por Tomás Biagi Carvalho. Cada edição parte de um tema e conta com editores convidados, como a edição 56, de outubro de 2026, com capa de Gleeson Paulino e Glória Kalil como editora convidada. Essa organização temática contribui para a construção de uma identidade editorial que articula diferentes perspectivas culturais e visuais. A revista publica quatro edições impressas por ano e mantém um site com conteúdo digital exclusivo e o acervo de mais de 15 anos de edições, além de uma loja física. Seu posicionamento é o de uma pausa no ruído do mundo contemporâneo, com edições feitas para serem lidas, relidas e guardadas. A assinatura de impresso e digital custa R$ 230 por ano (AMARELLO, [2026?]). Site: amarello.com.br. Instagram: @revistaamarello.","2026/2 ELLE BRASIL A ELLE Brasil é a versão nacional da revista francesa ELLE, criada na França em 1945 e lançada no Brasil em 1988 (MEIO & MENSAGEM, 2025), e trata de moda, beleza, cultura, sociedade e lifestyle. Além do site, que reúne reportagens, desfiles e lookbooks, mantém a ELLE impressa, com quatro volumes por ano em formato maior e acabamento de livro. Esse formato valoriza a apresentação visual dos conteúdos e reforça o caráter editorial da publicação. A mais recente, o volume 25, tem Bruna Marquezine na capa (ELLE BRASIL, [2026c?]). A marca amplia a revista em outros títulos impressos, voltados a homens, decoração, beleza e gastronomia, e oferece a ELLE View, área de conteúdos especiais exclusiva para assinantes. Newsletter semanal e podcast completam a presença digital. Site: elle.com.br. Instagram: @ellebrasil.","FORBESLIFE FASHION A ForbesLife Fashion é a revista de moda da Forbes Brasil, lançada em novembro de 2021 em versão impressa e digital e eleita Lançamento Editorial de 2021 no Prêmio Veículos de Comunicação (FORBESLIFE..., 2022). A publicação aborda a moda a partir de uma perspectiva ligada ao mercado de luxo, reunindo conteúdos sobre marcas, profissionais e tendências do setor. É semestral porque acompanha os desfiles, que acontecem duas vezes por ano, e foi pensada para ser lida com calma em um mercado dominado pelo imediatismo digital. A edição de número 11, lançada em setembro de 2026, tem Deva Cassel na capa e está disponível no aplicativo da Forbes Brasil (MEIRELLES, 2026). A revista reúne entrevistas, perfis de marcas e uma editoria dedicada à sustentabilidade. Site: forbes.com.br. 2026/2","4PS4PS4PS4PS4 PS4PS4PS4PS4P PS4PS4PS4PS4PS PS4PS4PS4PS4P S4PS4PS4PS4PS 4PS4PS4PS4PS4 4PS4PS4PS4PS4 AMARELLO ELLE BRASIL FORBESLIFE FASHION Revista de arte, cultura, design e sociedade, com edições temáticas e editores convidados. Revista de moda, beleza e cultura, com volumes impressos e uma área digital para assinantes. Revista semestral de moda, com entrevistas, editoriais e perfis de marcas. Assinatura anual de R$ 230, com impresso e digital (AMARELLO, [2026?]). Edição avulsa a R$ 68. Assinatura anual da ELLE Premium a R$ 299,90, com 4 edições impressas e acesso digital (ELLE BRASIL, [2026a?], [2026b?]). Preço de capa não divulgado. Valores de revenda no Mercado Livre entre R$ 119,90 e R$ 149,90 (MERCADO LIVRE, [2026?]). PRAÇA Impresso, site e loja física. Impresso, site e newsletter. Impresso e aplicativo da Forbes Brasil. PROMOÇÃO Divulgação por meio de site, Instagram, Facebook e Vimeo. Divulgação por meio de site, newsletter, podcast e redes sociais. Divulgação por meio do site e do aplicativo da Forbes Brasil e de eventos de lançamento. 4 Ps PRODUTO PREÇO 2026/2","MACROTENDÊNCIA Em escala global, a relação entre trabalho e tempo expõe uma contradição: processos mais rápidos não se convertem em mais tempo para viver. Rosa (2019) interpreta esse movimento pela aceleração social, na qual os ganhos de velocidade são absorvidos pelo aumento das tarefas e das expectativas de produtividade. Segundo a Organização Internacional do Trabalho (OIT, 2023), mais de um terço dos trabalhadores no mundo cumpre regularmente jornadas superiores a 48 horas semanais. Diante desse cenário, diferentes países testam outros arranjos de jornada. Na Islândia, experimentos entre 2015 e 2019 reduziram a semana de cerca de 2.500 trabalhadores para 35 ou 36 horas, sem corte salarial: a produtividade se manteve, o bem-estar melhorou e, depois disso, 86% da força de trabalho do país passou a ter jornadas menores ou o direito de reduzi-las (HARALDSSON; KELLAM, 2021). No Reino Unido, a semana de quatro dias foi testada em 61 organizações, e 56 decidiram mantê-la após o experimento (LEWSEY, 2023). Essas experiências colocam em discussão como converter ganhos de eficiência em descanso, convivência e autonomia. 2026/2","COMPORTAMENTO No Brasil, a relação com o tempo aparece tanto na rotina de trabalho quanto na percepção de seus limites. Segundo pesquisa Datafolha (APOIO..., 2026), 43% dos brasileiros economicamente ativos consideram insuficiente o tempo para lazer e descanso. Entre os que trabalham seis ou sete dias por semana, o percentual chega a 59%, diante de 29% entre aqueles com jornada de até cinco dias. A diferença mostra como a organização do trabalho interfere nas possibilidades de convivência, recuperação e participação em outras experiências para além da atividade profissional. 2026/2 As desigualdades persistem mesmo após o expediente. Dados de 2022 divulgados pelo IBGE (2024) indicam que as mulheres dedicavam, em média, 21,3 horas semanais a cuidados e afazeres domésticos, enquanto os homens dedicavam 11,7 horas. Essas tarefas revelam que o tempo fora do emprego nem sempre é tempo disponível para si. Ao mesmo tempo, 71% dos brasileiros com 16 anos ou mais apoiam o fim da escala 6×1 (APOIO..., 2026). O resultado expressa uma expectativa coletiva por outra distribuição do tempo, embora nem todos disponham das mesmas condições para reivindicá-la ou vivenciá-la.","REPERCUSSÕES NA ERCUSSÕES REPERC PERCUSSÕES IMAGEM DE MODA ERCUSSÕESREPERCU RCUSSÕESREPERCUS CUSSÕESREPERCUSS REPERCUS CUSSÕESREPERCUSS USSÕESREPERCUSSÕ 2026/2 As transformações na relação com o tempo oferecem à imagem de moda questões que ultrapassam a representação literal de relógios ou calendários. A tensão entre produtividade, descanso e autonomia pode orientar narrativas construídas pela interação entre vestuário, corpo e ambiente. Uma postura corporal rígida em um espaço de circulação, por exemplo, pode sugerir pressão ou contenção; já gestos mais livres e relações menos funcionais com o espaço podem abrir interpretações ligadas à pausa e à disponibilidade. Essas leituras dependem da composição integral da fotografia, e não de um elemento isolado. No editorial de moda, direção criativa, styling, iluminação e enquadramento organizam essas relações e podem produzir contrastes entre diferentes experiências temporais. A repetição de gestos, a variação das distâncias entre câmera e corpo e a presença de espaços cotidianos são possibilidades de linguagem, não soluções previamente definidas para TEMPO REI. Para o projeto, a pesquisa sociocultural funciona como fundamento conceitual para investigar como a imagem pode construir sentidos sobre o tempo, preservando a experimentação visual nas etapas de criação.","2026/2 REPERCUSSÕES A pesquisa contribuiu para o desenvolvimento da narrativa visual do editorial TEMPO REI, especialmente na construção dos contrastes entre aceleração e contemplação. Essas relações orientaram as escolhas de ambientação, gestualidade e composição fotográfica, permitindo representar diferentes experiências do tempo por meio da imagem de moda.","2026/2 BRIEFING NOME: TEMPO REI PUBLICAÇÃO: Cartola Magazine CONCORRENTES: Amarello, ELLE Brasil e ForbesLife Fashion CONCEITO: o tempo como questão social e contemporânea. TEMÁTICA: crítica social à organização do tempo na contemporaneidade: aceleração, produtividade e desigualdade no acesso ao descanso. EQUIPE: João Pedro de Oliveira (direção criativa, fotografia e styling); Naila Sperotto (assistência de direção, fotografia e styling); Nicole Reiser (modelo, beleza e cabelo). CASTING: uma única modelo, Nicole Reiser, que também assina beleza e cabelo. PÚBLICO-ALVO: jovens adultos de 18 a 30 anos interessados em moda, arte, fotografia, design e cultura visual, detalhados por estilo de vida e persona (Helena Martins, 26 anos). STYLING: look da coleção TEMPO REI combinado a peças de brechó e do acervo pessoal, na lógica da moda circular. BELEZA E CABELO: pele natural, olhos com sombra avermelhada e amarronzada, lábios entre nude e terracota; cabelo cacheado natural, solto. ACTING: gestos que alternam pressa, sobrecarga e pausa. LINHA ESTILÍSTICA: fotografia de estúdio integrada a cenários digitais, com a mesma modelo, a mesma luz e uma cartela de cenário constante. ENQUADRAMENTO: corpo inteiro, planos médios e detalhes; ângulo normal e contra-plongée. ILUMINAÇÃO: artificial de estúdio, suave e difusa, com fundo neutro e baixo contraste. LOCAÇÃO: estúdio fotográfico da UNIVALI. CENÁRIOS: criados com inteligência artificial; ambientes urbanos sombrios em cinza, preto, branco, verde militar e bordô.","UIPE EQUIPE EQUIPE EQ EQUIPE PEEQUIPEEQUIPEEQU EQ PEEQUIPEEQUIPEEQU EEQUIPEEQUIPEEQUIP EQUIPEEQUIPEEQUIP QUIPEEQUIPEEQUIPE 2026/2 JOÃO PEDRO DE OLIVEIRA NAILA SPEROTTO NICOLE REISER Direção criativa, fotografia e styling Assistência de direção, fotografia e styling Modelo, beleza e cabelo","2026/2 CASTING NICOLE REISER Idade: 21 anos Altura: 1,60 m Manequim: 36 Sapato: 36 Cabelo: castanho-escuro, cacheado Olhos: pretos Instagram: @nicolereiser O editorial foi realizado com uma única modelo, Nicole Reiser, que também assina a beleza e o cabelo. Ela acompanha toda a sequência de imagens e veste as diferentes composições de styling.","TEMÁTICA Este editorial expõe uma crítica à sociedade contemporânea e à forma como ela organiza o tempo. A pesquisa mostrou que a aceleração dos processos não se converteu em mais tempo livre e que a possibilidade de descansar, contemplar e decidir sobre a própria rotina não é distribuída da mesma forma entre as pessoas. Giurge, Whillans e West (2020) descrevem essa condição como pobreza de tempo, a sensação persistente de ter mais demandas do que tempo para atendê-las. O editorial trata o tempo, assim, como questão coletiva, atravessada por trabalho, produtividade e desigualdade, e não apenas como dificuldade individual de organização. 2026/2 A crítica não se dá pela representação literal de relógios ou calendários, mas pela relação entre corpo, roupa e espaço. O conceito da coleção, segundo o qual o tempo se deposita em camadas sobre o corpo até que o que estava oculto atravesse a superfície, orienta as imagens: gestos de pressa, sobrecarga e interrupção convivem com momentos de pausa, e os cenários urbanos e sombrios contrastam com as cores que surgem entre as camadas do styling. Assim, o editorial propõe ao leitor da Cartola Magazine reconhecer, na imagem de moda, tensões que atravessam o próprio cotidiano.","BLICO-ALVO PÚBLICO-A PÚBLICO-ALVO LICO-ALVOPÚBLICO-AL PÚBLICO-A CO-ALVOPÚBLICO-ALV PÚBLICO-AL CO-ALVOPÚBLICO-ALV O-ALVOPÚBLICO-ALVO -ALVOPÚBLICO-ALVO 2026/2 Este editorial tem como público-alvo jovens adultos entre 18 e 30 anos, interessados em moda, arte, fotografia, design e outras manifestações da cultura visual. A delimitação considera principalmente seus interesses culturais e sua receptividade a produções editoriais que ultrapassam a apresentação do vestuário, utilizando a imagem como meio de expressão e construção de significados. Embora direcionado aos leitores da Cartola Magazine, o editorial também busca estabelecer conexões com pessoas que se identificam com as questões contemporâneas abordadas pelo projeto.","2026/2 ESTILO DE VIDA O estilo de vida considerado no projeto não corresponde a uma rotina homogênea, mas a experiências atravessadas por diferentes exigências de tempo. Entre trabalho, estudos, deslocamentos, relações pessoais e atividades de interesse cultural, jovens adultos organizam seus dias de maneiras diversas, conforme suas condições materiais, responsabilidades e possibilidades de escolha. A presença da moda, da arte, da fotografia e do design em seus repertórios não implica necessariamente uma profissão criativa ou um padrão específico de consumo, mas indica abertura a linguagens visuais e narrativas contemporâneas.","PERSONA 2026/2 Nome: Helena Martins Idade: 26 anos Naturalidade: Chapecó – SC Localização: Florianópolis – SC Formação: graduação em Design Ocupação: designer gráfica em agência Mora: sozinha, no centro Filhos: não tem Helena Martins tem 26 anos e nasceu em Chapecó, no oeste de Santa Catarina. Mudou-se para Florianópolis aos 18 para cursar Design e ficou na cidade depois da formatura. Há quatro anos trabalha como designer gráfica em uma agência e ESTILO DE VIDA mora sozinha em um apartamento pequeno no Acorda cedo para tomar café centro. Passa a semana entre reuniões, prazos e o sem pressa antes do trabalho. celular, e costuma estender o expediente sem Aos domingos, desliga as notificações e vai à praia ou a perceber. No fim de semana, tenta compensar o uma feira de rua. ritmo dos dias úteis. O TEMPO E A ROUPA Helena sente que a semana passa sem que perceba e que o descanso, às vezes, vira mais uma tarefa a cumprir. Ainda não nomeia essa sensação como uma questão coletiva, mas a reconhece no cansaço dos colegas e nas conversas com os amigos. Compra pouca roupa, prefere brechós e marcas autorais e escolhe peças diferentes e bem construídas, feitas para acompanhar muitos momentos. Na roupa e na revista impressa, procura o que pede atenção e não se esgota no primeiro olhar. Fotografa amigos e viagens com uma câmera analógica. Lê revistas de moda e cultura e guarda as edições impressas. Vai a exposições, shows pequenos e cafés da cidade com os amigos. A persona é uma figura fictícia construída a partir das características do público-alvo, com nome, trajetória e hábitos, para tornar esse público mais concreto durante o projeto. Neste projeto, Helena auxilia a avaliar a clareza e a pertinência das decisões de direção criativa, sem representar todos os leitores da Cartola Magazine.","STYLING LING STYLINGSTYLING NG STYLING STYLING S ING NGSTYLINGSTYLINGST GSTYLINGSTYLINGSTY ST GSTYLING STYLING STY GSTYLING STYLINGSTYLINGSTYL 2026/2 O styling parte do look da coleção TEMPO REI e o combina com peças das marcas Hering, Zara, Colcci, Dudalina, TNG e Jean de Lys, além de acessórios do acervo pessoal do autor. Mais do que compor uma aparência, o styling integra a direção criativa como uma operação de seleção e combinação que orienta a leitura da imagem. Marcas reconhecíveis aparecem ao lado das peças autorais da coleção. Essa convivência aproxima o repertório do cotidiano do universo conceitual de TEMPO REI. Ela também desloca o vestuário comum para o campo editorial, em que a roupa, articulada ao corpo, passa a operar como discurso (CASTILHO; MARTINS, 2005). Embora assinadas por essas marcas, todas as roupas, exceto o look da coleção TEMPO REI utilizado como objeto de estudo deste memorial, foram adquiridas em brechós de Balneário Camboriú: o Brechó das Estrelas, na Rua 1500, e o BemDito, na Terceira Avenida. Elas chegam ao editorial depois de um primeiro ciclo de uso e carregam um tempo anterior que não aparece na etiqueta. Assim, deixam de ser produto de lançamento e passam a ser objeto em circulação contínua. A temática discute a aceleração. Diante dela, a escolha pelo brechó contrapõe a permanência das peças ao ritmo de substituição do consumo de moda e prepara a discussão sobre moda circular, apresentada no próximo slide.","2026/2 MODA CIRCULAR A moda circular propõe manter as roupas em uso pelo maior tempo possível, por meio de práticas como revenda, troca, empréstimo, aluguel, conserto e reaproveitamento. Em vez do percurso linear de produzir, usar e descartar, a peça passa por diferentes ciclos de uso e por diferentes pessoas antes de chegar ao fim de sua vida útil (ELLEN MACARTHUR FOUNDATION, 2017). Os brechós ocupam um papel central nesse sistema, porque recolocam em circulação peças que já foram produzidas e adiam o seu descarte. No editorial, essa lógica aparece na própria produção: o styling foi construído com peças de segunda mão e do acervo pessoal. A escolha dialoga com a temática de TEMPO REI, porque uma roupa de brechó acumula o tempo de outros usos e de outros corpos, em contraste com a renovação acelerada das coleções. A roupa usada não aparece como solução para a crítica proposta, mas como um modo de vestir que estabelece outra relação com o tempo.","2026/2 BELEZA E CABELO A beleza parte de uma pele natural, com textura aparente e pouco efeito de acabamento, e de olhos marcados por sombra avermelhada e amarronzada, esfumada ao redor das pálpebras. Os lábios seguem tons próximos da pele, entre o nude e o terracota. O cabelo mantém a textura natural da modelo, castanho-escuro e cacheado, com finalização solta e levemente desalinhada, sem penteados estruturados, para que os fios acompanhem o movimento do corpo nas cenas de ação. Em algumas composições, os óculos apoiados no alto da cabeça afastam o cabelo do rosto e mantêm a expressão visível nos planos médios. As referências sugerem um rosto atravessado pelo cansaço e por noites mal dormidas, sem que a maquiagem se torne caricatura do esgotamento. A proposta aproxima a beleza da experiência de sobrecarga discutida na temática: o vermelho em torno dos olhos remete ao desgaste da rotina acelerada e dialoga com o bordô dos cenários e das listras do styling. A execução da beleza e do cabelo é de Nicole Reiser.","ING ACTING ACTING AC TING ACTING NGACTINGACTINGACT GACTINGACTINGACT GACTINGACTINGACTIN ACTINGACTINGACTING ACTIN ACTINGACTINGACTING O acting define como o corpo da modelo comunica o conceito do editorial. Nas fotografias do ensaio, os gestos alternam pressa, sobrecarga e pausa: a modelo caminha em movimento interrompido, segura papéis que escapam das mãos, equilibra-se em uma cadeira de escritório com o notebook sobre as pernas e, em outras cenas, senta-se no chão para ler uma revista. As referências reunidas no moodboard de acting mostram corpos captados no meio da ação, com pernas estendidas, passos largos, objetos nas mãos e poses que fogem da apresentação frontal das peças. Desse repertório, o editorial extrai um princípio: o gesto carrega a narrativa, e a roupa é vista enquanto o corpo reage à rotina, não em uma pose de apresentação. A alternância entre tensão e pausa retoma o contraste entre escassez e contemplação presente na coleção. 2026/2","","2026/2 LINHA ESTILÍSTICA A linha estilística corresponde ao olhar fotográfico que orienta o editorial: as escolhas de luz, enquadramento, direção da modelo e tratamento de imagem que dão unidade à sequência. Neste projeto, a fotografia e a direção criativa são assinadas por João Pedro de Oliveira, o que concentra em uma mesma pessoa a construção do conceito e a sua tradução em imagem. A linha proposta combina fotografia de estúdio, com luz uniforme e fundo neutro, e cenários construídos digitalmente. O corpo é registrado em ação, com gestos interrompidos e objetos do cotidiano de trabalho, e depois situado em ambientes urbanos sombrios. A unidade do editorial deve vir da repetição desses procedimentos: a mesma modelo, a mesma qualidade de luz e uma cartela de cenário constante, enquanto as roupas e as poses variam ao longo da sequência.","ENQUADRAMENTO A sequência alterna planos de corpo inteiro, que mostram a relação entre corpo, roupa e espaço, com planos médios e detalhes, que aproximam o olhar das listras, texturas e sobreposições. A alternância de escalas, princípio extraído da análise dos editoriais de referência, evita que o editorial se reduza à apresentação do look. Nos planos de corpo inteiro, o espaço ao redor da modelo foi ocupado pelos cenários criados com IA, o que exigiu deixar margem no enquadramento para a integração do ambiente. 2026/2 Ângulo predominante: normal, com a câmera na altura da modelo, e algumas imagens em contra-plongée, de baixo para cima.","MINAÇÃOILUMINAÇÃO ILUMINAÇÃO INAÇÃO ILUMINAÇÃO I MINAÇÃO NAÇÃOILUMINAÇÃOIL AÇÃO ILUMINAÇÃO ILU NAÇÃO AÇÃOILUMINAÇÃOILUM ÇÃOILUMINAÇÃOILUM Tipo de luz: artificial, em estúdio Qualidade: suave e difusa Sombras: leves, projetadas no fundo, atrás da modelo Fundo: neutro e claro Contraste: baixo, preservando cores, listras e texturas do styling Equipamentos: flash de estúdio 2026/2 A luz uniforme do estúdio mantém a leitura das sobreposições, das listras e das texturas do styling. A atmosfera do editorial não vem da iluminação do ensaio, mas dos cenários criados com IA, o que exige atenção à coerência entre a luz das fotografias e a dos ambientes gerados.","CARTELA DE CORES STYLING BRANCO PANTONE 11-0602 TCX PRETO PANTONE 19-3911 TCX ROSA PANTONE 13-2008 TCX VERMELHO PANTONE 17-1654 TCX LARANJA PANTONE 16-1255 TCX AMARELO PANTONE 13-0644 TCX TURQUESA PANTONE 14-5125 TCX AZUL-MARINHO PANTONE 19-3942 TCX 2026/2","CARTELA DE CORES CENÁRIO BRANCO RGB: 237 237 234 CINZA CLARO RGB: 184 187 189 CINZA ESCURO RGB: 74 78 82 PRETO RGB: 20 20 20 VERDE MILITAR RGB: 72 80 63 BORDÔ RGB: 94 26 36 2026/2","RTELA DE CORES CARTE CARTELA DE CORES CART TELADECORESCARTE ELADECORESCARTEL LADECORESCARTELA A DE CORES CARTELA D LA ADECORESCARTELAD BELEZA PELE RGB: 210 164 136 NUDE (LÁBIOS) RGB: 185 132 108 TERRACOTA RGB: 166 90 66 VERMELHO QUEIMADO (OLHOS) RGB: 140 47 43 MARROM ESFUMADO RGB: 92 58 44 CASTANHO-ESCURO (CABELO) RGB: 42 28 23 2026/2","LOCAÇÃO E CENÁRIO As fotografias foram realizadas no estúdio fotográfico da UNIVALI, sobre fundo neutro e com luz controlada, sem locação externa. O espaço físico do ensaio funciona como base para uma segunda etapa: os cenários do editorial foram criados com inteligência artificial, com prompts desenvolvidos no Claude (Anthropic) e imagens geradas no ChatGPT (OpenAI), e integrados às fotografias. Dessa forma, o ambiente deixa de ser um lugar encontrado e passa a ser uma construção da direção criativa, definida a partir do conceito e da temática do projeto. As referências, os prompts e as versões geradas são apresentados nos slides de moodboard e de processo criativo. A direção dos cenários parte de ambientes urbanos de atmosfera sóbria, com predominância de tons de cinza, preto e branco, verde militar e acentos de bordô. A arquitetura de grandes cidades, como São Paulo, e a linguagem construtivista, com volumes geométricos, linhas e planos marcados, servem de referência para espaços associados à rotina acelerada e à pressão sobre o corpo. A rigidez desses ambientes contrasta com as cores e as sobreposições do styling, retomando a tensão entre imposição e liberdade presente no conceito. 2026/2","","PROCESSO CRIATIVO 2026/2 ROTEIRO GERAL - O roteiro geral orienta a criação dos quatro cenários do editorial e estabelece os parâmetros comuns a todas as imagens. A sequência acompanha a rotina de uma pessoa ao longo de vários dias, em quatro momentos: a rua, no trajeto para o trabalho; a fachada de um edifício comercial, na chegada; o escritório, durante o expediente; e o parque, depois que a personagem abandona as obrigações. A irreverência cresce a cada cenário, do descompasso na rua à ruptura no escritório, com os papéis lançados ao ar. Cada look corresponde a um dia, e os looks se alternam nos três primeiros cenários. A aceleração, a produtividade e a desigualdade no acesso ao tempo livre atravessam a narrativa sem que uma delas predomine, e o desfecho expressa a saturação diante do próprio tema, como se a personagem se cansasse de discuti-lo. Os cenários se situam em São Paulo, reinventada em um futuro próximo, com marcos reais combinados em montagens impossíveis. A arquitetura combina o brutalismo, com concreto aparente e volumes pesados; o construtivismo, com formas geométricas e planos marcados; e o futurismo, com superfícies espelhadas e formas orgânicas. A vegetação ocupa os edifícios e os espaços públicos, e letreiros, telas e pontos de neon aparecem de forma pontual. A paleta é sóbria, com predominância de cinzas e preto, branco nas superfícies de luz e acentos de verde militar e bordô, conforme a cartela de cenário, de modo que as roupas sejam a única área saturada da imagem. Método: a IA gera apenas o cenário vazio, e a modelo é inserida por fotocomposição, sem alteração das roupas. Luz: natural, de céu encoberto, difusa e sem sombras duras, compatível com a luz do estúdio; mesma hora e clima nos quatro cenários, com luzes coloridas restritas ao fundo. Câmera: na altura da cintura, com lente normal (35 a 50 mm), verticais retas e horizonte no centro da imagem, alinhado à cintura da modelo; os planos mostram o chão e o céu ou o teto. Pessoas: figuras em tons neutros, sem detalhe nos rost
