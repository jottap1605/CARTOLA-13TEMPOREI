pin.it/lvkCNLqBY. Acesso em: 8 nov. 2026. 2026/2 <contexto> Cenário de parque para um editorial de moda ambientado em São Paulo, reinventada em um futuro próximo. A imagem será usada em fotocomposição: a IA gera apenas o cenário, e a modelo é inserida depois, em pé ou sentada no gramado do primeiro plano. É o último cenário da sequência: um fim de tarde perfeito, de descanso e leveza. A imagem 1 é a referência de enquadramento: o lago do Parque Ibirapuera com a ponte ao fundo, emoldurado por árvores. A imagem 2 é a referência das estruturas brancas em forma de árvore, integradas à vegetação. A imagem 3 é a referência de clima de parque futurista. <\/contexto> <tarefa> Crie o Parque Ibirapuera em uma versão futurista, com o enquadramento da imagem 1, mas mostrando mais gramado: a margem do lago vira um gramado amplo em leve aclive, que ocupa toda a metade inferior da imagem. O lago fica na lateral esquerda, com a ponte em arco atravessando-o ao fundo, como na imagem 1. Árvores grandes emolduram a cena nas laterais e no topo. <\/tarefa> <camera> Altura do peito, levemente de cima para baixo, lente de 35 mm, verticais retas. Horizonte no terço superior da imagem, com uma faixa de céu visível acima da ponte. A área central do gramado no primeiro plano fica livre, sem pessoas nem objetos, para a inserção da modelo. <\/camera> <arquitetura> - Ponte em arco sobre o lago, como na imagem 1, como elemento real protagonista. - Duas ou três estruturas brancas e lisas em forma de árvore, com copas vazadas de formas orgânicas, como na imagem 2, no meio-plano à direita, misturadas às árvores verdadeiras e sem cobrir a ponte. - Ao fundo, além da ponte: o horizonte de São Paulo em prédios brutalistas de concreto aparente, de alturas variadas, com apenas um ou dois prédios brancos de formas orgânicas entre eles. Tudo baixo e distante, suavizado pela névoa, ocupando no máximo a faixa do horizonte, como os prédios da imagem 1, e não dominando o céu como na imagem 3. - Um pequeno trem branco na margem oposta do lago, distante e discreto. - No segundo e terceiro planos: pessoas pequenas, felizes e relaxadas, fazendo yoga sobre tapetes e deitadas tomando sol no gramado, em roupas de tons neutros e sem detalhe nos rostos. <\/arquitetura> <luz_e_paleta> Fim de tarde, um pouco antes do pôr do sol: o sol baixo atrás da ponte, suave e meio velado pela névoa, refletindo em dourado no lago. Céu em degradê de azul-claro no topo para dourado e pêssego perto do horizonte, sem tons de noite. A frente da cena recebe luz dourada, suave e difusa, sem contraluz forte e sem sombras duras. Gramado e árvores em verdes naturais, levemente suavizados, puxando para o verde militar. Nenhuma área de cor muito saturada. <\/luz_e_paleta> <restricoes> - Sem flores rosas ou magenta e sem cores fortes na vegetação. - Nada alto no centro do primeiro plano. - Não deixe os prédios do fundo nem o trem competirem com a ponte. - Sem logotipos ou marcas reais; sem textos. - Fotografia realista, com granulação e nitidez uniformes. <\/restricoes> <formato_de_saida> Uma imagem horizontal, 3:2. <\/formato_de_saida> IDEIAS (8 nov.): LOCAL: Parque Ibirapuera, só o parque no fundo, sem edifícios; o parque assume o papel de protagonista; um pouco do horizonte e do céu no fundo. CENA: plano mais fechado; modelo sentada no chão sobre uma almofada de veludo bege, lendo uma revista, sozinha no primeiro plano; pessoas felizes e relaxadas fazendo yoga e pegando sol no segundo e terceiro planos, dentro do cenário; gramado verde. TOM: leveza, dia perfeito, utopia, destoando do restante do projeto; luz de pôr do sol, dourada, amarela e suave.","RESULTADOS Os cenários finais resultaram das versões geradas e ajustadas ao longo do processo criativo. Cada imagem passou por sucessivas edições até atender aos parâmetros do roteiro geral: luz difusa compatível com a do estúdio, paleta sóbria, câmera na altura da cintura e espaço livre para a inserção da modelo. Em conjunto, os cinco cenários mantêm a unidade de uma mesma São Paulo reinventada em um futuro próximo e acompanham a progressão da narrativa: da rua contida à chegada ao trabalho, do escritório em desordem ao parque no fim de tarde, a cidade passa de pressão a pausa. A capa assume a noite como exceção declarada ao roteiro. Esses cenários servem de base para a fotocomposição realizada na pós-produção. Os prompts apresentados nas páginas de geração de alternativas correspondem às versões iniciais de cada cenário. A partir delas, foram realizadas diversas edições sucessivas, com ajustes de composição, luz, escala e elementos arquitetônicos, até chegar às imagens finais. Por sua extensão, esses prompts de edição não foram reproduzidos integralmente neste memorial. As imagens utilizadas como referência na geração dos cenários estão identificadas junto aos prompts, com suas referências elaboradas conforme as normas da ABNT. 2026/2","ULTADOSRESULTADO SULTADOSRESULTADO ULTADOSRESULTADOS ULTADOSRESULTADO LTADOSRESULTADOS TADOSRESULTADOSR ADOSRESULTADOSRE TADOSRESULTADOSRE ADOSRESULTADOSRES 2026/2","2026/2","2026/2","HASDECAMARIM FICHAS DE CAMARIM HASDECAMARIM ASDECAMARIMF ASDECAMARIM ASDECAMARIMF SDECAMARIMFI SDECAMARIMFIC As fichas de camarim organizam as informações de cada look para o dia da produção fotográfica. Cada ficha reúne as roupas, os sapatos e acessórios, a referência de beleza e a referência de acting, além dos dados da equipe, da data e do horário do ensaio, orientando a troca de looks e a direção da modelo. Os cenários não foram definidos nas fichas. Como os ambientes do editorial são construídos digitalmente após o ensaio, defini-los antes limitaria as combinações possíveis entre fotografias e cenários. A escolha do cenário de cada imagem ficou para a pós-produção, preservando a liberdade de montagem do editorial. 2026/2","TEMPO REI FICHA DE CAMARIM LOOK 1 ROUPAS Projeto João Pedro de Oliveira Fotografia João Pedro de Oliveira Assist. foto Naila Sperotto Direção João Pedro de Oliveira Beleza Nicole Re ão Naila Sperotto Data / horário REFERÊNCIA DE ACTING SAPATO/ACESSÓRIOS BELEZA 24 de set 2026 às 14h30","TEMPO REI FICHA DE CAMARIM LOOK 8 ROUPAS Projeto João Pedro de Oliveira Fotografia João Pedro de Oliveira Assist. foto Naila Sperotto Direção João Pedro de Oliveira Beleza Nicole Reiser Assist. direção Naila Sperotto Data / horário REFERÊNCIA DE ACTING SAPATO/ACESSÓRIOS BELEZA 24 de set 2026 às 14h30","DEMDODIAORD DEMDODIAORDE ORDEM DO DIA EMDODIAORDEM EMDODIAORDE EMDODIAORDEM MDODIAORDEM MDODIAORDEMD 2026/2 24 DE SETEMBRO DE 2026 — ESTÚDIO FOTOGRÁFICO DA UNIVALI 13h — Chegada ao estúdio e organização do espaço e do material 13h30 — Chegada da modelo e início da maquiagem 14h — Chegada da assistente de styling e início da produção 14h30 — Início das fotografias 17h — Encerramento das fotografias, desmontagem e organização do estúdio","2026/2 DOCUMENTAÇÃO E USO DE IMAGEM LEGISLAÇÃO. A Constituição Federal (art. 5º, X) protege a imagem da pessoa (BRASIL, 1988), e o Código Civil (art. 20) condiciona sua divulgação e uso à autorização de quem é retratado (BRASIL, 2002). A Lei de Direitos Autorais (Lei nº 9.610/1998, art. 11) define como autor a pessoa física criadora da obra (BRASIL, 1998). Por isso, a inteligência artificial não é reconhecida como autora nem como titular de direitos, e funciona como ferramenta de quem a utiliza. REGULAMENTAÇÃO. Ainda não há definição legal no Brasil sobre a proteção autoral de imagens geradas por inteligência artificial. O Projeto de Lei nº 2.338/2023, que propõe o marco regulatório da IA, seguia em tramitação no Congresso Nacional em 2026 (BRASIL, 2023). Suas regras sobre direitos autorais tratam principalmente do uso de obras protegidas no treinamento dos sistemas. NA PRÁTICA. O uso da imagem de Nicole Reiser foi formalizado por um termo de autorização de uso de imagem, que prevê a publicação na Cartola Magazine e o uso acadêmico no TIC II. Os prompts dos cenários foram elaborados com o Claude, da Anthropic, e as imagens foram geradas com o ChatGPT, da OpenAI. Os termos de uso da OpenAI transferem ao usuário os direitos que a empresa eventualmente tenha sobre as imagens geradas (OPENAI, [2026?]).","RESULTADOS A produção fotográfica do editorial TEMPO REI foi realizada em 24 de setembro de 2026, seguindo o planejamento estabelecido na ordem do dia. Durante o ensaio, foram produzidas fotografias da modelo com diferentes poses, enquadramentos e composições, considerando sua posterior integração aos cenários digitais. A direção criativa buscou estabelecer relações entre corpo, vestuário e narrativa, mantendo a coerência com o conceito do editorial. 2026/2","ULTADOSRESULTADO SULTADOSRESULTADO ULTADOSRESULTADOS ULTADOSRESULTADO LTADOSRESULTADOS TADOSRESULTADOSR ADOSRESULTADOSRE TADOSRESULTADOSRE ADOSRESULTADOSRES 2026/2","2026/2","2026/2","ULTADOSRESULTADO SULTADOSRESULTADO ULTADOSRESULTADOS ULTADOSRESULTADO LTADOSRESULTADOS TADOSRESULTADOSR ADOSRESULTADOSRE TADOSRESULTADOSRE ADOSRESULTADOSRES 2026/2","2026/2","2026/2","ULTADOSRESULTADO SULTADOSRESULTADO ULTADOSRESULTADOS ULTADOSRESULTADO LTADOSRESULTADOS TADOSRESULTADOSR ADOSRESULTADOSRE TADOSRESULTADOSRE ADOSRESULTADOSRES 2026/2","2026/2","2026/2","TIDORESBASTIDORES STIDORESBASTIDORES TIDORESBASTIDORESB BASTIDORES DORESBASTIDORESB DORESBASTIDORESBA ORESBASTIDORESBAS RESBASTIDORESBAST 2026/2 As imagens apresentadas nesta seção correspondem a uma seleção dos registros realizados durante o ensaio, com o objetivo de documentar o processo de produção fotográfica e apresentar uma prévia do material desenvolvido.","2026/2 PÓS-PRODUÇÃO A pós-produção do editorial TEMPO REI envolveu a seleção e o tratamento das fotografias realizadas em estúdio e sua integração aos cenários desenvolvidos com auxílio de inteligência artificial. A integração por IA chegou a ser testada, mas as ferramentas regeneravam a imagem em vez de editá-la, o que alterava a fotografia original e lhe dava aspecto de ilustração. Por isso, o tratamento das fotografias (pele, cores e texturas das roupas) foi feito manualmente, e a integração aos cenários foi realizada por fotocomposição no Canva: recorte da modelo, organização em camadas e ajustes de luz, cor, sombra e proporção, buscando unidade visual entre o corpo fotografado e os ambientes digitais.","2026/2","S-PRODUÇÃOPÓS-PRO PRODUÇÃOPÓS-PRO -PRODUÇÃOPÓS-PRO PRODUÇÃOPÓS-PROD RODUÇÃOPÓS-PROD ODUÇÃOPÓS-PRODU RODUÇÃOPÓS-PRODU ODUÇÃOPÓS-PRODUÇ 2026/2","ORÇAMENTO 2026/2 ITEM VALOR TRANSPORTE R$ 16,94 ALIMENTAÇÃO Sem custo direto ROUPAS E ACESSÓRIOS Sem custo direto MATERIAIS DE PRODUÇÃO Sem custo direto ESTÚDIO FOTOGRÁFICO Sem custo direto BELEZA E CABELO Sem custo direto OUTROS CUSTOS R$ 279,00 TOTAL R$ 295,94","2026/2 COMPOSTO MERCADOLÓGICO JOÃO PEDRO DE OLIVEIRA DESIGNER E STYLIST 23 anos, graduando em Design de Moda pela Univali. Atua nas áreas de design e styling, com interesse em direção criativa, moda conceitual e criação de narrativas visuais. Desde 2026, trabalha como designer na Santa Costa, onde apoia a consultoria de imagem e styling, a criação de conteúdo e a pesquisa de tendências. De 2023 a 2025, foi visual merchandiser na Tok&Stok, na montagem de ambientes e composições expositivas, experiência que fortaleceu seu olhar para espaço, ambientação e comunicação visual. Integrou as equipes de styling e camarim do Balneário Fashion Show e, em outros projetos, atuou como assistente de cenografia. Em 2026, participou do SCMC (Santa Catarina Moda e Cultura), em projeto desenvolvido em conjunto com a Hering, que envolveu uma imersão na empresa e a criação de uma coleção, da qual parte o look de TEMPO REI estudado neste projeto. Como ferramentas de comunicação, utiliza o Instagram (@jpedro.16), com a divulgação dos trabalhos e do processo criativo; o portfólio digital, que reúne projetos de styling, capa editorial, ilustração e catálogos; o LinkedIn, com o currículo profissional; e o Pinterest, utilizado para a criação de moodboards e pesquisa de referências.","MPOSTOMERCADOLÓ POSTO MERCADOLÓG MPOSTOMERCADOLÓ POSTOMERCADOLÓG OSTOMERCADOLÓGIC MERCADOLÓGI OSTOMERCADOLÓGIC STOMERCADOLÓGICO 2026/2","2026/2 PROPOSTA COMERCIAL O editorial TEMPO REI foi desenvolvido como uma proposta de publicação na Cartola Magazine, considerando a linguagem visual da revista, seu público e a possibilidade de circulação das imagens em plataformas digitais. A escolha da publicação se deu pela afinidade entre sua estética, que valoriza imagens conceituais e narrativas visuais, e a proposta do editorial. Como publicação independente, a Cartola Magazine dialoga com o público-alvo do projeto, formado por jovens adultos de 18 a 30 anos interessados em moda, arte, fotografia e cultura visual. A edição mais recente, com o tema Suspensão, tratou dos períodos de transição da contemporaneidade, e seus editoriais foram produzidos por estudantes, o que demonstra a abertura da revista a novos criadores. A proposta é apresentada por meio de uma simulação de capa, que reúne os principais elementos visuais do editorial. Trata-se de uma proposta acadêmica: o editorial não foi aprovado nem publicado pela revista.","Acordar, correr, chegar, produzir, repetir. O relógio dita o ritmo da cidade e de quem vive nela. TEMPO REI acompanha um dia em que o tempo deixa de ser medida e passa a ser personagem: na pressa da rua, na chegada ao trabalho, no absurdo do escritório e, por fim, na pausa que ninguém agendou. Entre o que se deve fazer e o que se deseja viver, fica a pergunta: quem governa o seu tempo? 2026/2","2026/2 DIREÇÃO CRIATIVA, FOTOGRAFIA E STYLING: João Pedro de Oliveira ASSISTÊNCIA DE DIREÇÃO, FOTOGRAFIA E STYLING: Naila Sperotto MODELO, BELEZA E CABELO: Nicole Reiser (@nicolereiser) LOCAÇÃO: Estúdio fotográfico da Univali CENÁRIOS: desenvolvidos com auxílio de inteligência artificial PEÇAS: look da coleção TEMPO REI e acervo pessoal PÓS-PRODUÇÃO E FOTOCOMPOSIÇÃO: João Pedro de Oliveira","2026/2 CONSIDERAÇÕES FINAIS O desenvolvimento do editorial TEMPO REI possibilitou explorar a direção criativa e a fotografia como recursos para ampliar o universo conceitual de uma coleção de moda. A articulação entre styling, corpo, ambientação e composição fotográfica contribuiu para a construção de uma narrativa visual relacionada às diferentes formas de vivenciar o tempo. O desenvolvimento seguiu as etapas da metodologia MD3E, que orientou o percurso do projeto de forma aberta e adaptável ao longo de cerca de três meses. Na pré-concepção, a pesquisa sobre o tempo como questão social e contemporânea, a análise de mercado e a análise de editoriais fundamentaram as decisões criativas. Na concepção, esses resultados foram traduzidos em conceito, moodboards, roteiros de cenário e definições de styling, beleza e linguagem fotográfica. Na pós-concepção, a produção em estúdio, a pós-produção e a proposta de publicação na Cartola Magazine concretizaram a narrativa visual do editorial. A utilização de cenários digitais desenvolvidos com auxílio de inteligência artificial ampliou as possibilidades de experimentação visual, permitindo explorar diferentes ambientes relacionados ao conceito. O processo também exigiu decisões sobre enquadramento, iluminação e coerência entre os elementos da imagem. Dessa forma, o projeto demonstra como a direção criativa pode contribuir para comunicar os significados de uma coleção para além da apresentação do vestuário. A principal dificuldade encontrada durante o desenvolvimento foi a gestão do tempo, ao conciliar as etapas de pesquisa, produção e pós-produção com o prazo de entrega e as demais demandas da rotina. De certa forma, o projeto vivenciou a própria questão que investiga: a sensação de ter mais demandas do que tempo para atendê-las. Para solucioná-la, ferramentas de inteligência artificial foram utilizadas para agilizar etapas do processo, como a organização dos slides e de seus layouts, a padronização de margens e da diagramação e a revisão ortográfica e das normas da ABNT.","REFERÊNCIAS ADEGEEST, Don-Alvin. Off-White appoints Ibrah function converte(file,prev,st){return carregaPdfjs().then(function(lib){return file.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise;});}).then(function(pdf){
 var n=pdf.numPages,out=[],total=0,i=0;
 function uma(){i++;if(i>n)return Promise.resolve({paginas:out,total:total});st.textContent='Convertendo página '+i+' de '+n+'…';
  return pdf.getPage(i).then(function(pg){var v1=pg.getViewport({scale:1}),alvo=v1.width>v1.height?1600:1400,sc=Math.min(alvo/v1.width,3),vp=pg.getViewport({scale:sc});
   var cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
   return pg.render({canvasContext:cx,viewport:vp}).promise.then(function(){return pg.getTextContent().catch(function(){return{items:[]};});}).then(function(tc){
    var txt=tc.items.map(function(x){return x.str;}).join(' ').replace(/\s+/g,' ').trim().slice(0,4000);
    return new Promise(function(ok){cv.toBlob(function(b){ok(b);},'image/jpeg',0.8);}).then(function(b){total+=b.size;if(total>LIMITE)throw{msg:'Passa de 50 MB depois de convertido ('+mb(total)+' até a página '+i+'). Tente um PDF mais leve.'};
     out.push({blob:b,w:cv.width,h:cv.height,txt:txt});if(i<=6){var im=el('img');im.src=URL.createObjectURL(b);prev.appendChild(im);}cv.width=cv.height=0;return uma();});});});}
 return uma();});}
function novoId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function sobeCloudinary(blob,pasta,nome){var fd=new FormData();fd.append('file',blob,nome);fd.append('upload_preset',CLD.preset);fd.append('folder',pasta);fd.append('public_id',nome.replace(/\.jpg$/,''));
 return fetch('https://api.cloudinary.com/v1_1/'+CLD.cloud+'/image/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){if(!d||!d.secure_url)throw d;return d.secure_url.replace('/upload/','/upload/f_auto,q_auto/');});}
function publica(conv,dados,st){var id=novoId(),urls=[],k=0;
 function sobe(){if(k>=conv.paginas.length)return Promise.resolve();var p=conv.paginas[k],nome='p'+String(k+1).padStart(3,'0')+'.jpg';st.textContent='Enviando página '+(k+1)+' de '+conv.paginas.length+'…';
  return sobeCloudinary(p.blob,'materias/'+id,nome).then(function(u){urls.push({s:u,w:p.w,h:p.h});k++;return sobe();});}
 return sobe().then(function(){st.textContent='Salvando…';var reg={titulo:dados.titulo,grupo:dados.grupo,resumo:dados.resumo,sobre:dados.sobre,processo:dados.processo,creditos:dados.creditos,paginas:urls,textos:conv.paginas.map(function(p){return p.txt;}),t:firebase.database.ServerValue.TIMESTAMP};
  return fb.database().ref('site/materias/'+id).set(reg);}).then(function(){return id;});}

var vz={l:[],i:0};

 [vz.i+1,vz.i-1].forEach(function(j){if(vz.l[j]){var p=new Image();p.src=vz.l[j].src;}});}

$('vz-x').addEventListener('click',fechaVz);$('vz-p').addEventListener('click',function(){passo(-1);});$('vz-n').addEventListener('click',function(){passo(1);});
(function(){var x0=null,y0=0;$('vz').addEventListener('pointerdown',function(e){if(e.target.tagName==='BUTTON')return;x0=e.clientX;y0=e.clientY;});
 $('vz').addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0,dy=e.clientY-y0;x0=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))passo(dx<0?1:-1);else if(Math.abs(dy)>90)fechaVz();});})();
addEventListener('keydown',function(e){if($('vz').classList.contains('on')){if(e.key==='Escape')fechaVz();else if(e.key==='ArrowRight')passo(1);else if(e.key==='ArrowLeft')passo(-1);return;}
 if(e.key==='Escape'){menu(false);}if(rota==='revista'&&pf&&document.activeElement.tagName!=='INPUT'){if(e.key==='ArrowRight'||e.key==='PageDown')pf.flipNext('top');else if(e.key==='ArrowLeft'||e.key==='PageUp')pf.flipPrev('top');}});
